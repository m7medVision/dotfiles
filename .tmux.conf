set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm*:RGB:clipboard:usstyle,tmux*:RGB:clipboard'
set -g focus-events on
set -s escape-time 10
set -g mouse on
setw -g mode-keys vi
set -s set-clipboard on
set -g allow-passthrough on
set -ag update-environment ' WAYLAND_DISPLAY XDG_RUNTIME_DIR'

unbind C-b
set -g prefix C-s
bind C-s send-prefix

bind r source-file ~/.tmux.conf \; display-message "Reloaded!"

bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

bind s run-shell '$HOME/go/bin/sx'

unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind x kill-pane

bind c new-window -c "#{pane_current_path}"

bind -n C-S-Left previous-window
bind -n C-S-Right next-window

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
set -g @yank_selection_mouse 'clipboard'

set -g status-left ' #S '
set -g status-right ''
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
run '~/.tmux/plugins/tpm/tpm'
run '~/.config/tmux/apply-hyprshell-theme.sh'
bind Y run-shell 'tmux save-buffer - | wl-copy'
