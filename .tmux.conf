set -g default-terminal "tmux-256color"

# RGB color + undercurl
set -ga terminal-features ",*:usstyle"
set -gs terminal-overrides ",*:RGB"

# Kitty support
set-option -as terminal-overrides ',xterm-kitty:blink=\E[5m'
set-option -as terminal-features ',xterm-kitty:RGB:extkeys:hyperlinks:clipboard'

# Pi agent support
set -g extended-keys always
set -g extended-keys-format csi-u

# Clipboard
set -g set-clipboard on

# Allow passthrough for modern terminal features
set -gq allow-passthrough on

# Focus events for editors/agents
set-option -g focus-events on

# Keep ~/go/bin (gitmux) in tmux's env so status modules can find it
# even when tmux is started outside the user's shell.
set -ga update-environment PATH

# Timing
set -sg escape-time 1
set -g display-time 1500
set -g display-panes-time 2000


# General

# Prefix: Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded!"

# Lazygit popup (Prefix + g)
bind-key g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"

# Session / worktree-agent switcher (sx — Go TUI, replaces session-switcher.sh)
#   enter: switch  |  ctrl-x: kill  |  ctrl-n: new session  |  ctrl-w: worktree
bind-key s run-shell '$HOME/go/bin/sx'

# Input
set -g mouse on
setw -g mode-keys vi

# Scrollback
set -g history-limit 100000

# Windows and panes start from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Short window titles: just the command basename, not the full path/args.
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_command}"

# ─────────────────────────────────────────────────────────────────────
# Status bar — Catppuccin (https://github.com/catppuccin/tmux)
# Auto light/dark: dark → Mocha, light → Latte.
# ─────────────────────────────────────────────────────────────────────

set -g status on
set -g status-right ""
set -g status-position top
set -g status-interval 5
set -g status-left-length 60
set -g status-right-length 150
set -g window-status-separator " "

# ── Catppuccin options (must be set before the plugin loads below) ───
set -g @catppuccin_flavor "mocha"            # default; corrected to system theme on startup
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_flags "icon"       # /  /  /  per-window indicators
set -g @catppuccin_window_text " #W#F"
set -g @catppuccin_window_current_text " #W#F"

# Powerline separators between status modules (Catppuccin defaults;
# declared explicitly so flavor switches don't drop them).
set -g @catppuccin_status_left_separator  ""
set -g @catppuccin_status_right_separator ""

# Status modules — session on the left; git · host · battery · dir · clock
# on the right. `gitmux` is a custom module backed by the `gitmux` Go
# binary (see ~/.config/tmux/catppuccin-gitmux.conf); the rest are
# built-in Catppuccin modules.
set -g status-left  "#{E:@catppuccin_status_session}"

# ── Auto light/dark switching ───────────────────────────────────────
# Modern terminals (Ghostty, etc.) report theme changes via OSC — react
# instantly. (tmux ≥ 3.2)
set-hook -g client-dark-theme  "run-shell '~/.config/tmux/reload-catppuccin.sh mocha'"
set-hook -g client-light-theme "run-shell '~/.config/tmux/reload-catppuccin.sh latte'"

# Manual toggle (prefix + T)
bind-key T run-shell ~/.config/tmux/toggle-theme.sh

# Activity
set -g visual-activity off


# Key Bindings — Panes / Windows

# Split panes using | and -
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Close pane without confirmation
bind-key x kill-pane

# New window in current path
bind-key c new-window -c "#{pane_current_path}"


# Window navigation
bind-key -n C-S-Left previous-window
bind-key -n C-S-Right next-window

# Key Bindings — Vim / Neovim-aware Navigation

%hidden VIM_PATTERN='(\S+\/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'
%hidden IS_VIM="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${VIM_PATTERN}'"

bind-key -n C-h if-shell "$IS_VIM" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$IS_VIM" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$IS_VIM" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$IS_VIM" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

bind-key -n M-h if-shell "$IS_VIM" 'send-keys M-h' 'resize-pane -L 1'
bind-key -n M-j if-shell "$IS_VIM" 'send-keys M-j' 'resize-pane -D 1'
bind-key -n M-k if-shell "$IS_VIM" 'send-keys M-k' 'resize-pane -U 1'
bind-key -n M-l if-shell "$IS_VIM" 'send-keys M-l' 'resize-pane -R 1'


# Key Bindings — Copy Mode

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Copy using tmux clipboard / OSC 52
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Extra Wayland fallback: Prefix + Y copies current tmux buffer to wl-copy
bind-key Y run-shell 'tmux save-buffer - | wl-copy'


# TPM Plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.3.0'   # Catppuccin status bar theme

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# Catppuccin is now fully loaded (run-shell above is synchronous, so the
# @thm_* palette exists). Build the custom gitmux module.
if "test -f ~/.config/tmux/catppuccin-gitmux.conf" \
   "source-file ~/.config/tmux/catppuccin-gitmux.conf"

# Override the built-in `battery` module text with our /sys-based script
# (avoids the `tmux-battery` plugin dependency).
if "test -f ~/.config/tmux/catppuccin-battery.conf" \
   "source-file ~/.config/tmux/catppuccin-battery.conf"

# Apply the system theme on startup (and for terminals without OSC theme
# reporting). Must run after TPM so the plugin is present to reload.
run-shell ~/.config/tmux/apply-system-theme.sh
