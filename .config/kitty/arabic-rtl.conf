# Mode B — full BiDi via GNU FriBidi. Launch with:
#   kitty --config ~/.config/kitty/arabic-rtl.conf     (alias: kar)
# Use this for full SENTENCES. Mode A (plain kitty) only gets single words
# right — it renders each word RTL but leaves word order logical.
# Reading-only: fribidi cannot reach your prompt or a TUI's grid.
include kitty.conf

# Hand all directionality to fribidi; kitty must not also reorder.
force_ltr yes

# Marks this window as Mode B so the rtl()/R shell helpers know they are safe.
env KITTY_BIDI=1

# NOTE: kitty's docs suggest pairing force_ltr with
#   font_features NotoNaskhArabic-Regular +isol -medi -fina -init
# DO NOT do that here. That is for viewing raw U+06xx text in isolated forms.
# fribidi emits U+FExx presentation forms which are already correctly shaped,
# and +isol forces each to its isolated variant, breaking the joining.
# Verified on screen: with those lines the letters render disconnected.
