# Arabic-capable font mapping; colors are themed separately below.
font_family GeistMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 10.0
# Headroom so harakat (ـَ ـُ ـّ) are not clipped at the cell top.
modify_font cell_height 115%

# ── Arabic ─────────────────────────────────────────────────────────────
# kitty has no BIDI, but it DOES shape Arabic (init/medi/fina via HarfBuzz)
# and displays RTL words right-to-left. force_ltr must stay `no` for that.
# For line-level BIDI use the Mode B profile: kitty --config arabic-rtl.conf
force_ltr no
disable_ligatures never

# Route every Arabic block to Noto Naskh Arabic; JetBrainsMono has no Arabic.
# Blocks: Arabic, Supplement, Extended-B, Extended-A, Presentation Forms A & B.
# Presentation Forms (FB50/FE70) are what `fribidi` outputs — needed for Mode B.
symbol_map U+0600-U+06FF,U+0750-U+077F,U+0870-U+089F,U+08A0-U+08FF,U+FB50-U+FDFF,U+FE70-U+FEFF Noto Naskh Arabic

cursor_shape          block
cursor_blink_interval 0.75
scrollback_lines      10000
window_padding_width  10
enable_audio_bell     no
shell_integration     enabled

# Colors follow GNOME's light/dark preference via kitty's automatic theme files:
# dark-theme.auto.conf (Catppuccin Mocha), light-theme.auto.conf and
# no-preference-theme.auto.conf (Catppuccin Latte).

# Disable Ctrl+Shift+Right and Ctrl+Shift+Left for Tmux compatibility
map ctrl+shift+right no_op
map ctrl+shift+left no_op
