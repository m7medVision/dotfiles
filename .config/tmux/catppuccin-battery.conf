# ─────────────────────────────────────────────────────────────────────
# Override Catppuccin's built-in `battery` status module to source its
# text from a local script reading /sys/class/power_supply/BAT* directly,
# avoiding the `tmux-battery` plugin dependency.
#
# Built-in battery.conf relies on `#{battery_percentage}` / `#{battery_icon}`
# from tmux-battery. We replace `_text` with a shell call; the dynamic
# charge-tier icon is included in the script output (see battery-status.sh).
# A static icon stays on the chip for visual parity with other modules.
#
# Re-sourced on flavor switch (see reload-catppuccin.sh).
# ─────────────────────────────────────────────────────────────────────

%hidden MODULE_NAME="battery"

set -gq   "@catppuccin_battery_icon"  " "        # static chip icon
set -gqF  "@catppuccin_battery_color" "#{E:@thm_lavender}"
set -gq   "@catppuccin_battery_text" \
  ' #(~/.config/tmux/battery-status.sh)'

# Re-run the module builder so the new text/icon take effect.
source -F "~/.tmux/plugins/tmux/utils/status_module.conf"
