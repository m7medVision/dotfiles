# ─────────────────────────────────────────────────────────────────────
# Custom Catppuccin status module: gitmux (icon + branch + ahead/behind +
# modified + untracked + stash via the `gitmux` Go binary).
#
# Mirrors the shape of catppuccin's built-in modules
# (see ~/.tmux/plugins/tmux/status/gitmux.conf) so it inherits the
# flavor palette, powerline separators, and theme switching for free.
#
# Requires the `gitmux` binary on $PATH (~/go/bin/gitmux).
# The wrapper at ~/.config/tmux/gitmux-status.sh is the single point
# where extras (timeout, future indicators) get added.
#
# NOTE: the module colors are baked in at build time (the builder uses
# format-expanding `set -F`), so this file MUST be re-sourced after every
# flavor switch. reload-catppuccin.sh does this automatically.
# ─────────────────────────────────────────────────────────────────────

%hidden MODULE_NAME="gitmux"

set -ogq  "@catppuccin_${MODULE_NAME}_icon" "󰊢 "
set -ogqF "@catppuccin_${MODULE_NAME}_color" "#{E:@thm_teal}"
set -gq   "@catppuccin_${MODULE_NAME}_text" \
  ' #(~/.config/tmux/gitmux-status.sh "#{pane_current_path}")'

source -F "~/.tmux/plugins/tmux/utils/status_module.conf"
