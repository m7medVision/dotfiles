# Idle behavior — lock, blank, suspend
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep = pidof hyprlock || hyprlock
    after_sleep = hyprctl dispatch dpms on
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
}

# 10.5 min: screen off after lock settles
listener {
    timeout = 630
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 min: suspend (battery saver)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
