# hyprlock — redesigned to match hyprshell (Nord, flat, sharp).
#
# Design tokens (mirrors ~/.local/state/hyprshell/current/theme):
#   bg #2e3440 / fg #d8dee9 / accent #81a1c1 / urgent #bf616a
#   muted #9ea4b0 / font JetBrainsMono Nerd Font
#   rounding 0, border 2, no shadow, no blur  (see hypr/looknfeel.lua)
#
# Layout (center-anchored, 1080p baseline):
#   clock + date  → above the input, same format as the bar ("ddd d MMM  h:mm AP")
#   input-field   → Nord card, accent border, sharp corners
#   AI USAGE      → below the input, powered by hyprlock-ai.sh (same
#                   `ai-usagebar` backend as the hyprshell ai-usage widget)
#   layout/user   → bottom corners, muted

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Instant lock, no fade — same as before.
animations {
    enabled = false
}

background {
    monitor =
    color = rgba(46, 52, 64, 1.0)
    # Same wallpaper as the laptop: hyprshell's background plugin drives the
    # desktop from this symlink (currently Nord 0-black-moon.jpg). Pointing
    # hyprlock at it keeps lock + desktop in sync across theme switches.
    path = ~/.local/state/hyprshell/current/background
    # Flat like the shell: looknfeel.lua sets blur { enabled = false }.
    blur_passes = 0
}

# ── Clock (bar format: "ddd d MMM  h:mm AP") ──────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%I:%M %p"
    color = rgba(216, 222, 233, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%a %-d %b"
    color = rgba(158, 164, 176, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 105
    halign = center
    valign = center
}

# ── Password input (hyprshell [lock] surface) ───────────────────────
input-field {
    monitor =
    size = 520, 64
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(46, 52, 64, 0.8)
    outer_color = rgba(129, 161, 193, 1.0)
    check_color = rgba(129, 161, 193, 1.0)
    fail_color = rgba(191, 97, 106, 1.0)
    outline_thickness = 2

    font_family = JetBrainsMono Nerd Font
    font_color = rgba(216, 222, 233, 1.0)

    placeholder_text = Enter Password
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

# ── AI usage (same backend as the hyprshell ai-usage widget) ────────
# Refresh matches the widget default: every 5 min (300000 ms).
# The shape is the highlight card behind the three labels — Nord fill at
# 0.85 with an accent border, sharp corners like every other hyprshell
# surface. It sits at zindex 0, the labels at 1, so text stays on top.
shape {
    monitor =
    size = 600, 120
    color = rgba(46, 52, 64, 0.85)
    rounding = 0
    border_size = 2
    border_color = rgba(129, 161, 193, 1.0)
    rotate = 0
    xray = false
    position = 0, -120
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor =
    text = AI USAGE
    color = rgba(129, 161, 193, 1.0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -90
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:300000] $HOME/.config/hypr/hyprlock-ai.sh primary
    color = rgba(216, 222, 233, 1.0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -120
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:300000] $HOME/.config/hypr/hyprlock-ai.sh secondary
    color = rgba(158, 164, 176, 0.85)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
    zindex = 1
}

# Keyboard layout — you toggle us/ara with Alt+Shift, so without this
# there's no way to tell which layout you're typing your password in.
label {
    monitor =
    text = $LAYOUT[EN,AR]
    color = rgba(216, 222, 233, 0.4)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -20, 20
    halign = right
    valign = bottom
}

# User@host, muted in the opposite corner (uname -n: `hostname` isn't installed).
label {
    monitor =
    text = cmd[update:3600000] echo "$USER@$(uname -n)"
    color = rgba(216, 222, 233, 0.4)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 20, 20
    halign = left
    valign = bottom
}
