# Lock screen — one big input field, nothing else.
general {
    hide_cursor = true
    ignore_empty_input = true
}

# Show the lock instantly, no fade.
animations {
    enabled = false
}

background {
    monitor =
    color = rgba(26, 26, 26, 1.0)
    path = ~/Pictures/wp12949039.jpg
    blur_passes = 3
}

input-field {
    monitor =
    size = 650, 100
    position = 0, 0
    halign = center
    valign = center

    # Solid, single-color border — no gradient.
    inner_color = rgba(26, 26, 26, 0.8)
    outer_color = rgba(255, 255, 255, 0.5)
    check_color = rgba(255, 255, 255, 0.9)
    fail_color = rgba(200, 60, 60, 0.9)
    outline_thickness = 3

    font_family = JetBrainsMono Nerd Font
    font_color = rgba(255, 255, 255, 1.0)

    placeholder_text = Enter Password
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

# You toggle us/ara with Alt+Shift, so without this
# there's no way to tell which layout you're typing your password in.
label {
    monitor =
    text = $LAYOUT[EN,AR]
    color = rgba(255, 255, 255, 0.4)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -20, 20
    halign = right
    valign = bottom
}
